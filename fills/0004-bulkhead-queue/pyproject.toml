[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcrc-bulkhead"
version = "0.1.0"
description = "LCRC Fill 0004: bulkhead (bounded concurrency & queue) + CLI + tests."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Large Code-Run Collider" }]
license = { text = "MIT" }

[project.scripts]
lcrc-bulkhead = "lcrc_bulkhead.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]